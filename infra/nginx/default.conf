# Serves the built frontend and proxies the API, so the browser sees ONE origin
# (no CORS, cookies/tokens stay same-site).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 6m;   # résumé limit is 5 MB, plus multipart overhead
    server_tokens off;

    # Resolve "api" through Docker's DNS at request time (re-checked every 10 s), so a recreated
    # API container with a new IP doesn't break the site until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers live in a snippet because nginx drops inherited add_header lines in any
    # location that declares its own (the cache rules below do).
    include /etc/nginx/snippets/security.conf;

    location ~ ^/(api|health)/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # Overwrite, never append: a client-supplied X-Forwarded-For would let anyone pick their
        # own "IP" and dodge the per-address rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;   # an assistant turn can take ~60 s on the free LLM tier
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass $api;
        proxy_set_header Host $host;
        # Swagger UI loads its JS/CSS from a CDN, so it gets a looser policy than the app.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com" always;
    }

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/app/search, /login, ...) all serve index.html, which is never cached.
    location / {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
