# Included by every location in default.conf (see the note there).
# The inline script in index.html is allowed by its hash; everything else must come from this origin.
# If you change that script, update the hash (see README.md).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-0IUeSYWRZhn9L7HdRJts6RVrjsrKSPHfn/LOVIoroQM='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
