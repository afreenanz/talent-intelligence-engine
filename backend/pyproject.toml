[project]
name = "talent-engine"
version = "0.1.0"
description = "Talent Intelligence Engine backend: retrieval, ranking, personalization and agentic job search"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic[email]>=2.12",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.40",
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
    "structlog>=25.4",
    "redis>=6.4",
    "pypdf>=5",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.uv]
# Reproducibility + supply-chain hygiene: ignore any release newer than this date
# (roughly two weeks before the lockfile was created). Bump deliberately.
exclude-newer = "2026-11-03T00:00:00Z"
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"migrations/**" = ["E501"]
# Seeded, reproducible randomness for synthetic data; not used for security.
"scripts/**" = ["S311"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a running Postgres (docker compose up)"]

[tool.coverage.run]
source = ["app"]
branch = true
