# Two ways to run:
#   docker compose up -d                      -> Postgres + Redis only (for local development)
#   docker compose --profile app up -d --build -> the whole app at http://localhost:8090
# Host ports are offset (5433, 6380) so they don't collide with natively installed Postgres/Redis.

name: talent-engine

# Every service keeps at most 3 x 10 MB of logs (Docker's default is unbounded).
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  postgres:
    logging: *logging
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tie_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tie}
    ports:
      # 127.0.0.1 only: the database (with its dev password) must not be reachable from the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    logging: *logging
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------ the app (profile "app")
  # Runs once per `up`: migrations, then bootstrap (idempotent: skills, jobs, embeddings, demo).
  init:
    logging: *logging
    profiles: [app]
    <<: &backend
      build: { context: ., dockerfile: backend/Dockerfile }
      image: talent-engine-backend
      env_file: [.env]
      environment: &backend-env
        ENVIRONMENT: production
        DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tie}:${POSTGRES_PASSWORD:-tie_dev_password}@postgres:5432/${POSTGRES_DB:-tie}
        # Its own Redis database (1): a natively-run dev API (db 0) never feeds this worker files it
        # can't see, and rate-limit counters stay separate.
        REDIS_URL: redis://redis:6379/1
        UPLOAD_DIR: /app/data/private/uploads
        JWT_SECRET: ${JWT_SECRET:-}   # required: production mode refuses to start without a strong one
        LOG_JSON: "true"
      volumes:
        - uploads:/app/data/private/uploads
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli bootstrap"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    logging: *logging
    profiles: [app]
    <<: *backend
    depends_on:
      init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s   # loads the embedding model on start
    restart: unless-stopped

  worker:
    logging: *logging
    profiles: [app]
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  beat:
    logging: *logging
    profiles: [app]
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    volumes: []
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    logging: *logging
    profiles: [app]
    build: { context: ., dockerfile: frontend/Dockerfile }
    image: talent-engine-web
    ports:
      # Only this machine (and the tunnel container) can reach the site. Sharing goes through
      # scripts/share.sh, never by opening a port to the network.
      - "127.0.0.1:${WEB_HOST_PORT:-8090}:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # ------------------------------------------------------------------ public link (profile "share")
  # A Cloudflare quick tunnel: a random https://*.trycloudflare.com address that reaches `web` while
  # this machine is on. No account needed. Start/stop it with scripts/share.sh.
  tunnel:
    logging: *logging
    profiles: [share]
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:80"]
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
