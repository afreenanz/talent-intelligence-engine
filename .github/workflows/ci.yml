name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: tie
          POSTGRES_PASSWORD: tie_dev_password
          POSTGRES_DB: tie_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U tie -d tie_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://tie:tie_dev_password@localhost:5433/tie_test
      REDIS_URL: redis://localhost:6380/0

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (from lockfile, exactly)
        run: uv sync --locked --python 3.13

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Migrations match models
        run: uv run alembic upgrade head && uv run alembic check

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing:skip-covered
